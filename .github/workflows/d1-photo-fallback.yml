name: D1 photo fallback

on:
  push:
    paths:
      - '.github/patch_d1_photo.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_d1_photo.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch_d1_photo.py .github/workflows/d1-photo-fallback.yml
          git add -A
          git commit -m "Store compressed proof photos in D1 without R2"
          git push
