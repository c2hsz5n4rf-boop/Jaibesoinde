    for(const e of tf?.entity||[]) if(e.tripUpdate?.trip?.tripId) trips.set(e.tripUpdate.trip.tripId,e.tripUpdate);
    const now=Date.now()/1000;
    const vehicles=[];
    for(const e of vf?.entity||[]){
