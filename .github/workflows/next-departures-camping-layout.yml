name: Next departures camping and balanced layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/next-departures-camping-layout.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ZIP reader dependency
        run: npm install fflate@^0.8.2 --save
      - name: Upgrade site
        run: python .github/scripts/upgrade_departures_camping_layout.py
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/worker.js src/entry.js public/app.js public/index.html public/app.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add next nearby departures high vehicle parking and balanced cards"
            git push
          fi
