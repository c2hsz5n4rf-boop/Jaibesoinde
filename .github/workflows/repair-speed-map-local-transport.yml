name: Improve site nearby features

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_ui_transport.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply site patch
        run: python scripts/patch_ui_transport.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/entry.js src/worker.js public/app.js public/index.html public/app.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add real place plans and tighten nearby transport"
            git push
          fi
