name: Fix core search transport and events

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-core-and-events.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair files
        run: python scripts/repair_core.py
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js src/entry.js src/worker.js
          git diff --cached --quiet || git commit -m "Repair search transport and add six month events"
          git push
