name = "jai-besoin-de"
main = "src/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"

# Les liaisons D1, R2 et e-mail seront ajoutées après le premier déploiement,
# depuis Cloudflare, sans bloquer la mise en ligne initiale du site.

[vars]
APP_NAME = "J’ai besoin de..."
MAIL_FROM = "notifications@VOTRE-DOMAINE.fr"
EVENTS_API_URL = "https://france-evasion-regions.com/api/open/evenements.json"
OVERPASS_URL = "https://overpass-api.de/api/interpreter"
TRANSPORT_DATASET_SLUG_SETRAM = "gtfs-du-reseau-des-transports-bus-et-tramway-setram-circulant-sur-le-territoire-le-mans-metropole"

[triggers]
crons = ["*/15 * * * *", "17 3 * * *"]
